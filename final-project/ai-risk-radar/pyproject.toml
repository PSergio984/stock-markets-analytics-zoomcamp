[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk-radar"
version = "0.1.0"
description = "AI Investment Risk Radar - Downside risk forecasting and defensive allocation simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "exchange-calendars>=4.5.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_risk_radar*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "historical_artifacts: Opt-in integration test requiring untracked historical binary artifacts",
]
